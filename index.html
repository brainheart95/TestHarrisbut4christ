<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Church – Home</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <!-- TOP BAR -->
    <header class="topbar">
<a href="index.html" class="topbar-left home-link">
            <img src="assets/logo.png" alt="Church Logo" class="logo" />
            <span class="site-title">My Church</span>
        </a>
        <nav class="topbar-nav">
            <a href="index.html" class="nav-link active">Home</a>
            <a href="archive.html" class="nav-link">Previous Services</a>
            <a href="about.html" class="nav-link">About / Contact</a>
        </nav>
    </header>

    <!-- HERO with cover image -->
    <section class="hero" id="top">
        <img src="assets/logo.png" alt="Church Cover" class="hero-cover" />

        <div class="hero-overlay"></div>

        <div class="hero-content">
            <h1>Welcome to Our Church</h1>
            <p>Faith • Community • Worship</p>
            <a href="#live" class="btn-primary">Watch Live</a>
        </div>
    </section>

    <!-- LIVE STREAM + COUNTDOWN -->
    <section id="live" class="section">
        <h2>Live Stream</h2>
        <p>Join us every Sunday at 10:30 AM</p>

        <div id="countdown" class="countdown">
            <!-- Filled by script.js -->
        </div>

        <div class="video-wrapper">
            <iframe 
                src="https://www.youtube.com/embed/live_stream?channel=YOUR_CHANNEL_ID"
                frameborder="0"
                allowfullscreen
                allow="autoplay; encrypted-media"
            ></iframe>
        </div>
    </section>

    <!-- SHORT INTRO -->
    <section class="section light">
        <h2>Who We Are</h2>
        <p class="section-intro">
            We are a community centered on Jesus, gathering weekly to worship, learn, and serve.
        </p>
    </section>

    <footer>
        <p>© 2025 My Church — All Rights Reserved</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
